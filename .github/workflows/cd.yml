name: CD Pipeline - Branch Prod

on:
  push:
    branches:
      - prod

jobs:
  security-scan:
    name: Job 1 - Scan Sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get install -y apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan image Docker
        run: |
          docker pull aminahfaye/intranet-newdeal:latest
          trivy image --severity HIGH,CRITICAL aminahfaye/intranet-newdeal:latest

  deploy:
    name: Job 2 - Déploiement Production
    runs-on: runner_prod
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull image
        run: docker pull aminahfaye/intranet-newdeal:latest

      - name: Stop ancien container
        run: docker stop intranet-prod || true

      - name: Remove ancien container
        run: docker rm intranet-prod || true

      - name: Déployer le site
        run: docker run -d --name intranet-prod -p 80:80 aminahfaye/intranet-newdeal:latest