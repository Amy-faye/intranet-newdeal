name: CI Pipeline - Branch Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Job 1 - Build Image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t aminahfaye/intranet-newdeal:latest .

  security-scan:
    name: Job 2 - Scan Securite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Trivy
        run: |
          sudo apt-get install -y apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Build image for scan
        run: docker build -t intranet-scan:latest .
      - name: Scan vulnerabilites - Bloquer si CRITICAL
        run: trivy image --exit-code 1 --severity CRITICAL intranet-scan:latest
      - name: Scan secrets
        run: trivy fs --security-checks secret .

  push-dockerhub:
    name: Job 3 - Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build et Push image
        run: |
          docker build -t aminahfaye/intranet-newdeal:latest .
          docker push aminahfaye/intranet-newdeal:latest

  notification:
    name: Notification Email
    runs-on: ubuntu-latest
    needs: [push-dockerhub]
    if: always()
    steps:
      - name: Envoi email succes
        if: needs.push-dockerhub.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline CI Reussi - Intranet NewDeal"
          to: ${{ secrets.MAIL_USERNAME }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: "Le pipeline CI sur la branche dev a reussi avec succes !"
      - name: Envoi email echec
        if: needs.push-dockerhub.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline CI Echoue - Intranet NewDeal"
          to: ${{ secrets.MAIL_USERNAME }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: "Le pipeline CI sur la branche dev a echoue !"