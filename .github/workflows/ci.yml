name: CI Pipeline - Branch Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Job 1 - Build Image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t aminahfaye/intranet-newdeal:latest .

  security-scan:
    name: Job 2 - Scan Sécurité
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v0.50.0/trivy_0.50.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.0_Linux-64bit.deb

      - name: Build image for scan
        run: docker build -t intranet-scan:latest .

      - name: Scan vulnerabilités
        run: trivy image --severity HIGH,CRITICAL intranet-scan:latest

      - name: Scan secrets
        run: trivy fs --security-checks secret .

  push-dockerhub:
    name: Job 3 - Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build et Push image
        run: |
          docker build -t aminahfaye/intranet-newdeal:latest .
          docker push aminahfaye/intranet-newdeal:latest